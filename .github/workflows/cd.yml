name: CD alone

on:
  push:
    branches:
      - feature/ci-cd-demo

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[cd-only]')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4